[package]
name = "websocket"
version = "0.1.0"
edition = "2021"
publish.workspace = true
license.workspace = true

# warp-lite: this crate retains its public API (`WebSocket`, `Message`,
# `Sink`/`Stream` traits, `tungstenite` re-export) so that GraphQL
# subscriptions and session sharing call sites still compile, but the
# `connect()` path always returns an error - no websocket dial is performed.

[dependencies]
anyhow.workspace = true
futures.workspace = true
futures-util.workspace = true
http.workspace = true
log.workspace = true
thiserror.workspace = true
pin-project.workspace = true

[dev-dependencies]
futures-test-sink = "0.1.1"
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
ws_stream_wasm = "0.7"
graphql-ws-client = {workspace = true, features = ["ws_stream_wasm"]}

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-tungstenite = {version = "0.28.2", features = ["tokio-rustls-manual-roots"]}
tokio = { workspace = true, features = ["io-util", "net", "time"] }
graphql-ws-client = {workspace = true, features = ["tungstenite"]}
